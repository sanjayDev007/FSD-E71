<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RBAC Demo — Frontend</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width:700px; margin:40px auto; }
    label { display:block; margin-top:10px }
    button { margin-top:12px }
    #secretBox { margin-top:20px; padding:12px; border:1px solid #ddd; background:#f9f9f9 }
  </style>
</head>
<body>
  <h1>Role-based Secret (Frontend)</h1>
  <div id="loginBox">
    <label>Username <input id="username" value="admin" /></label>
    <label>Password <input id="password" type="password" value="password" /></label>
    <label>Role (for registration) <select id="role"><option value="user">user</option><option value="admin">admin</option></select></label>
    <button id="registerBtn">Register</button>
    <button id="loginBtn">Login</button>
    <div id="loginStatus" aria-live="polite"></div>
  </div>

  <div id="actions" style="display:none">
    <p>Logged in as: <strong id="whoami"></strong></p>
    <button id="getSecretBtn">Get Admin Secret</button>
    <div id="secretBox" style="display:none">
      <h3>Secret</h3>
      <pre id="secretText"></pre>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
