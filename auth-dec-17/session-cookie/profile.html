<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile - Session Cookie Auth</title>
    <style>
      body{font-family:Segoe UI, Arial;max-width:900px;margin:40px auto;padding:0 20px}
      header{display:flex;justify-content:space-between;align-items:center}
      nav a{margin-right:12px}
      .card{border:1px solid #ddd;padding:24px;border-radius:8px;max-width:600px;margin:20px auto}
      .profile-field{margin-bottom:16px;padding:12px;background:#f8f9fa;border-radius:4px}
      .profile-field label{font-weight:600;display:block;margin-bottom:4px;color:#495057}
      .profile-field span{color:#212529}
      button{padding:12px 24px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px;margin-top:16px}
      button:hover{background:#c82333}
      .message{margin-top:16px;padding:12px;border-radius:4px}
      .error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
      .loading{text-align:center;color:#6c757d;font-style:italic}
    </style>
  </head>
  <body>
    <header>
      <h1>Auth Demo</h1>
      <nav>
        <a href="home.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>User Profile</h2>
        <div id="profileContent">
          <p class="loading">Loading profile...</p>
        </div>
        <button id="logoutBtn" style="display:none">Logout</button>
        <div id="message"></div>
      </section>
    </main>

    <script>
      const API_BASE = 'http://localhost:3000';

      async function loadProfile() {
        const token = localStorage.getItem('authToken');
        const profileContent = document.getElementById('profileContent');
        const messageEl = document.getElementById('message');
        const logoutBtn = document.getElementById('logoutBtn');

        if (!token) {
          messageEl.textContent = 'Please login first';
          messageEl.className = 'message error';
          profileContent.innerHTML = '';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/profile`, {
            method: 'GET',
            headers: {
              'Authorization': token
            }
          });

          if (response.ok) {
            const user = await response.json();
            profileContent.innerHTML = `
              <div class="profile-field">
                <label>Username:</label>
                <span>${user.username || 'N/A'}</span>
              </div>
              <div class="profile-field">
                <label>Phone:</label>
                <span>${user.phone || 'N/A'}</span>
              </div>
              <div class="profile-field">
                <label>Address:</label>
                <span>${user.address || 'N/A'}</span>
              </div>
              <div class="profile-field">
                <label>User ID:</label>
                <span>${user._id || 'N/A'}</span>
              </div>
            `;
            logoutBtn.style.display = 'inline-block';
          } else {
            const errorText = await response.text();
            messageEl.textContent = `Failed to load profile: ${errorText}`;
            messageEl.className = 'message error';
            profileContent.innerHTML = '';
            setTimeout(() => {
              localStorage.removeItem('authToken');
              window.location.href = 'login.html';
            }, 2000);
          }
        } catch (error) {
          messageEl.textContent = `Error: ${error.message}`;
          messageEl.className = 'message error';
          profileContent.innerHTML = '';
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('authToken');
        window.location.href = 'login.html';
      });

      // Load profile when page loads
      loadProfile();
    </script>
  </body>
</html>
