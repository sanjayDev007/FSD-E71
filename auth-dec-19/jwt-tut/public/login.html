<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Session Cookie Auth</title>
    <style>
      body{font-family:Segoe UI, Arial;max-width:900px;margin:40px auto;padding:0 20px}
      header{display:flex;justify-content:space-between;align-items:center}
      nav a{margin-right:12px}
      .card{border:1px solid #ddd;padding:24px;border-radius:8px;max-width:500px;margin:20px auto}
      .form-group{margin-bottom:16px}
      label{display:block;margin-bottom:6px;font-weight:600}
      input{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
      button{padding:12px 24px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px}
      button:hover{background:#0056b3}
      .message{margin-top:16px;padding:12px;border-radius:4px}
      .success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
      .error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
      .register-link{margin-top:16px;text-align:center}
    </style>
  </head>
  <body>
    <header>
      <h1>Auth Demo</h1>
      <nav>
        <a href="home.html">Home</a>
        <a href="register.html">Register</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Login</button>
        </form>
        <div id="message"></div>
        <div class="register-link">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </section>
    </main>

    <script>
      const API_BASE = 'http://localhost:3000';

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const messageEl = document.getElementById('message');
        messageEl.textContent = '';
        messageEl.className = 'message';

        try {
          const response = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          if (response.ok) {
            const data = await response.json();
            console.log(data);
            // Store the token in localStorage
            localStorage.setItem('authToken', data.token);
            
            messageEl.textContent = 'Login successful! Redirecting to profile...';
            messageEl.classList.add('success');
            setTimeout(() => {
              window.location.href = 'profile.html';
            }, 1000);
          } else {
            const errorText = await response.text();
            messageEl.textContent = `Login failed: ${errorText}`;
            messageEl.classList.add('error');
          }
        } catch (error) {
          messageEl.textContent = `Error: ${error.message}`;
          messageEl.classList.add('error');
        }
      });
    </script>
  </body>
</html>
